name: Build & Release Firmware

# Spustí sa pri:
#  - pushnutí kódu na main alebo feature vetvu  → kompiluje a ak verzia v
#    usbmouse.ino ešte nemá release, automaticky ho vytvorí
#  - pushnutí tagu v*.*.*                       → klasické tag-based release
#  - pull request na main                       → len kompiluje (overí build)
#  - manuálne cez GitHub UI                     → kompiluje, vytvorí release ak nový
on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # Potrebné pre vytvorenie GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Stiahni kód ────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Vytiahni verziu firmware z usbmouse.ino ───────────────────────
      - name: Extract firmware version
        id: ver
        run: |
          V=$(grep -oP '#define FIRMWARE_VERSION\s+"\K[^"]+' usbmouse.ino)
          if [ -z "$V" ]; then
            echo "::error::Nepodarilo sa nájsť FIRMWARE_VERSION v usbmouse.ino"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Detekovaná verzia: v$V"

      # ── 3. Skontroluj či release pre túto verziu už existuje ─────────────
      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" \
               --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️  Release ${{ steps.ver.outputs.tag }} už existuje – preskakujem."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "🆕  Release ${{ steps.ver.outputs.tag }} ešte neexistuje – vytvorím ho."
          fi

      # ── 4. Arduino CLI + cache ESP32 toolchainu ─────────────────────────
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cache Arduino data
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: arduino-esp32-

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "WiFiManager"
          arduino-cli lib install "ArduinoJson"

      # ── 5. Ak ide o tag push, over že tag = verzia v kóde ────────────────
      - name: Verify version matches tag (only for tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::Tag (v${TAG}) sa nezhoduje s FIRMWARE_VERSION \"${{ steps.ver.outputs.version }}\" v usbmouse.ino"
            exit 1
          fi
          echo "Verzia v kóde a tag sa zhodujú."

      # ── 6. Kompilácia firmware pre ESP32-S3 ──────────────────────────────
      - name: Compile sketch
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=default,PartitionScheme=default_8MB,FlashSize=8M,FlashMode=qio,PSRAM=opi" \
            --output-dir ./build \
            .

          echo "--- Výstupné súbory ---"
          ls -lh ./build/

          # Premenuj hlavný binary na firmware.bin (OTA updater očakáva tento názov)
          MAIN_BIN=$(find ./build -maxdepth 1 -name "*.ino.bin" \
                     ! -name "*.bootloader.bin" \
                     ! -name "*.partitions.bin" \
                     | head -1)

          if [ -z "$MAIN_BIN" ]; then
            echo "::error::Nenašiel sa skompilovaný .ino.bin súbor"
            ls ./build/
            exit 1
          fi

          cp "$MAIN_BIN" ./build/firmware.bin
          echo "Firmware: $(ls -lh ./build/firmware.bin)"

      # ── 7. Vždy uploadni artifact (aj pri PR / starých verziách) ─────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.tag }}-${{ github.run_number }}
          path: ./build/firmware.bin
          if-no-files-found: error

      # ── 8. Vytvor GitHub Release ak je verzia nová a ide o push ──────────
      - name: Create GitHub Release
        if: |
          steps.check.outputs.exists == 'false' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.event.pull_request == null
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Firmware ${{ steps.ver.outputs.tag }}"
          body: |
            ## Firmware ${{ steps.ver.outputs.tag }}

            Automaticky zostavená a vydaná verzia pre **ESP32-S3** (USB-OTG / TinyUSB).
            Vytvorená z commitu `${{ github.sha }}` na vetve `${{ github.ref_name }}`.

            ### Automatická aktualizácia
            ESP zariadenie si túto verziu stiahne samo do **1 hodiny**.
            Pre okamžitú aktualizáciu reštartuj zariadenie.
          files: ./build/firmware.bin
          fail_on_unmatched_files: true
          make_latest: true
